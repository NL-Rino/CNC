name: Dong goi file EXE cho Windows

# Chay tu dong moi khi co thay doi phan mem, hoac bam nut chay tay trong tab
# Actions. Ket qua: mot file .exe chay doc lap, tai ve o muc Releases hoac o
# phan Artifacts cua lan chay.
#
# May cat chay firmware FluidNC san co, khong con firmware tu viet nen o day
# chi dung phan mem may tinh. Dung bang cach bien dich cheo tu Linux sang
# Windows (mingw-w64) nen nhanh va cho ra dung file da kiem tra o may phat
# trien.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/plasma-cnc-firmware-5obgaw
    paths:
      - "loi_c/**"
      - "win/**"
      - "kiem_tra_c/**"
      - "fluidnc/**"
      - "Makefile"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  dong-goi:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai trinh bien dich cheo sang Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 make

      - name: Kiem tra file cau hinh FluidNC doc duoc
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml, sys
          for f in sorted(glob.glob("fluidnc/*.yaml")):
              d = yaml.safe_load(open(f, encoding="utf-8"))
              assert "axes" in d and "PlasmaSpindle" in d, f
              print(f, "->", len(d), "muc goc, doc duoc")
          PY

      - name: Chay toan bo bai kiem tra
        # Gom: thu vien moi noi, xep bai, mo phong 3D + the xep 2D, va lop ket
        # noi noi vao mot ban gia lap may FluidNC qua cap cong ao (pty).
        # Ban gia lap TU BAO HONG neu phan mem gui qua tay bo dem 127 byte.
        run: make kiem-tra

      - name: Dung file .exe
        run: make

      - name: Kiem tra file exe da tao ra
        run: |
          ls -la ra
          test -f ra/MayCatOng.exe
          file ra/MayCatOng.exe | grep -q "PE32+ executable (GUI) x86-64"

      - name: Tai file len phan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MayCatOng-windows-exe
          path: |
            ra/MayCatOng.exe
            fluidnc/*.yaml
          retention-days: 90

      - name: Tao ban phat hanh de tai ve truc tiep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "exe-${{ github.run_number }}" \
            ra/MayCatOng.exe fluidnc/may_cat_ong_esp32.yaml \
            fluidnc/may_cat_ong_esp32s3.yaml \
            --target "${{ github.sha }}" \
            --title "Phan mem may cat ong - ban ${{ github.run_number }}" \
            --notes "**MayCatOng.exe** - phan mem van hanh hang ngay: thu vien
          moi noi, the xep 2D, mo phong 3D, mo file .NC, nhich tay, chay/dung.
          Chay doc lap tren Windows, KHONG can cai gi them.

          May cat chay firmware **FluidNC**. Hai file .yaml kem theo la cau hinh
          may (chan GPIO, so xung, mo plasma, 7 nut bam) - chep vao ESP32 qua
          giao dien web cua FluidNC:

          - \`may_cat_ong_esp32.yaml\` cho ESP32 devkit goc
          - \`may_cat_ong_esp32s3.yaml\` cho ESP32-S3-WROOM-1 N16R8

          Tai ve, chay truc tiep. Windows Defender co the canh bao file exe moi
          tao: chon **More info** roi **Run anyway**."
